<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sagas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b0a;
      --rail: #121110;
      --ink: #f3ece1;
      --dim: #8a8176;
      --line: #262320;
      --accent: #d24a32;
      --accent-dim: #8f3224;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--ink);
      font-family: Sora, system-ui, sans-serif;
    }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(12,11,10,.92);
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1;
    }
    .brand i { font-style: italic; color: var(--accent); }
    .search {
      width: min(420px, 46vw);
      position: relative;
    }
    .search input {
      width: 100%;
      background: #181614;
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 16px 10px 38px;
      font: 400 13px Sora, sans-serif;
      outline: none;
    }
    .search input:focus { border-color: var(--accent-dim); }
    .search svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      opacity: .45;
    }
    .count {
      justify-self: end;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      min-height: 0;
    }
    .rail, .detail { min-height: 0; overflow: auto; }

    .rail {
      border-right: 1px solid var(--line);
      background: var(--rail);
      padding: 10px 8px 28px;
    }
    .saga {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: baseline;
      text-align: left;
      background: none;
      border: 0;
      color: var(--dim);
      font: 400 14px Sora, sans-serif;
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .saga:hover { color: var(--ink); background: #1a1816; }
    .saga.on {
      color: var(--ink);
      background: #1e1a17;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .saga .i {
      font-family: Fraunces, Georgia, serif;
      color: var(--accent);
      font-size: 13px;
    }
    .saga .nm { font-weight: 500; line-height: 1.25; }
    .saga .nf { font-size: 11px; color: var(--dim); }

    .detail {
      padding: 36px 48px 48px;
      background:
        radial-gradient(900px 420px at 100% 0%, #2a1612 0%, transparent 50%),
        var(--bg);
    }
    .kicker {
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .detail h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .note {
      max-width: 40rem;
      color: var(--dim);
      font-weight: 300;
      font-size: .95rem;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .films { list-style: none; max-width: 760px; }
    .films li {
      display: grid;
      grid-template-columns: 48px 1fr 120px;
      gap: 16px;
      align-items: baseline;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .films li:first-child { border-top: 0; }
    .n {
      font-family: Fraunces, Georgia, serif;
      color: var(--accent);
      font-size: 1.2rem;
    }
    .t { font-size: 1.02rem; font-weight: 400; line-height: 1.3; }
    .y {
      text-align: right;
      font-size: 12px;
      color: var(--dim);
      line-height: 1.45;
    }
    .y b { color: var(--ink); font-weight: 500; }

    .empty {
      display: none;
      padding: 40px 16px;
      color: var(--dim);
      text-align: center;
    }
    .empty.show { display: block; }

    @media (max-width: 820px) {
      header { grid-template-columns: 1fr auto; }
      .count { display: none; }
      .search { width: min(220px, 48vw); }
      .stage { grid-template-columns: 1fr; grid-template-rows: 148px 1fr; }
      .rail {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 6px;
        overflow: auto;
        padding: 12px;
      }
      .saga {
        flex: 0 0 auto;
        grid-template-columns: 1fr;
        min-width: 160px;
        background: #181614;
        border-radius: 12px;
      }
      .saga .i, .saga .nf { display: none; }
      .detail { padding: 22px 18px 32px; }
      .films li { grid-template-columns: 36px 1fr 88px; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Sagas <i>de cine</i></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="q" type="search" placeholder="Buscar saga o película" autocomplete="off">
      </div>
      <div class="count" id="count"></div>
    </header>
    <div class="stage">
      <nav class="rail" id="rail"></nav>
      <section class="detail" id="detail"></section>
    </div>
  </div>

const rail = document.getElementById("rail");
const detail = document.getElementById("detail");
let openId = S[0].id;
let q = "";

function match(s, needle) {
  if (!needle) return true;
  return (s.n + " " + s.note + " " + s.f.map(x => x[0]).join(" ")).toLowerCase().includes(needle);
}

function render() {
  const needle = q.trim().toLowerCase();
  const vis = S.filter(s => match(s, needle));
  document.getElementById("count").textContent = vis.length + " sagas";
  rail.innerHTML = vis.length ? vis.map((s, i) => `
    <button class="saga${s.id===openId?" on":""}" data-id="${s.id}" type="button">
      <span class="i">${String(i+1).padStart(2,"0")}</span>
      <span class="nm">${s.n}</span>
      <span class="nf">${s.f.length}</span>
    </button>`).join("") : `<p class="empty show">Nada con esa búsqueda.</p>`;
  rail.querySelectorAll(".saga").forEach(b => b.onclick = () => { openId = b.dataset.id; render(); });
  if (!vis.some(s => s.id === openId)) openId = vis[0] && vis[0].id;
  const s = S.find(x => x.id === openId);
  if (!s) { detail.innerHTML = ""; return; }
  detail.innerHTML = `
    <p class="kicker">${s.f.length} películas · orden de la historia</p>
    <h2>${s.n}</h2>
    <p class="note">${s.note}</p>
    <ol class="films">${s.f.map((x,i)=>`<li>
      <span class="n">${String(i+1).padStart(2,"0")}</span>
      <span class="t">${x[0]}</span>
      <span class="y"><b>${x[1]}</b><br>${x[2]}</span>
    </li>`).join("")}</ol>`;
}

document.getElementById("q").addEventListener("input", e => { q = e.target.value; render(); });
render();
  </script>
