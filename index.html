  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #09080a;
      --bg2: #121015;
      --panel: #16131a;
      --ink: #f6efe2;
      --mute: #a89b88;
      --gold: #d4b36a;
      --gold2: #9a7a3a;
      --line: rgba(212,179,106,.16);
      --shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a2118 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed; inset: 0;
      opacity: .05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 48px 24px 96px; }
    .hero { text-align: center; margin-bottom: 40px; }
    .kicker {
      font-size: 11px; letter-spacing: .38em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 14px; font-weight: 500;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(3.2rem, 8vw, 6.2rem);
      font-weight: 500; line-height: .9; margin: 0 0 14px;
      letter-spacing: -.02em;
    }
    h1 em { font-style: italic; color: var(--gold); }
    .lede {
      margin: 0 auto 28px; max-width: 36rem;
      color: var(--mute); font-weight: 300; font-size: 1.02rem; line-height: 1.55;
    }
    .search {
      position: relative; max-width: 420px; margin: 0 auto;
    }
    .search input {
      width: 100%; appearance: none;
      background: rgba(22,19,26,.8);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 999px;
      padding: 14px 18px 14px 46px;
      font: 400 15px Outfit, sans-serif;
      outline: none;
    }
    .search input:focus { border-color: var(--gold2); }
    .search svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      opacity: .55;
    }
    .meta-bar {
      display: flex; justify-content: center; gap: 18px;
      margin-top: 18px; color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (min-width: 980px) {
      .layout.has-open { grid-template-columns: 1fr 400px; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, #1b171f 0%, #120f15 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 16px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      width: 100%;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(212,179,106,.4); }
    .card.on {
      border-color: var(--gold);
      background: linear-gradient(180deg, #241c14 0%, #16110c 100%);
    }
    .card .count {
      font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--gold2); margin: 0 0 8px;
    }
    .card h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem; font-weight: 600; margin: 0 0 8px; line-height: 1.15;
    }
    .card p {
      margin: 0; color: var(--mute); font-size: .78rem; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px 22px;
      box-shadow: var(--shadow);
    }
    .layout.has-open .panel { display: block; }
    @media (min-width: 980px) {
      .panel { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: auto; }
    }
    @media (max-width: 979px) {
      .layout.has-open .panel {
        position: fixed; inset: auto 12px 12px; z-index: 8;
        max-height: 70vh; overflow: auto;
      }
      .close-mobile { display: block; }
    }
    .panel-kicker { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
    .panel h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2rem; font-weight: 600; margin: 0 0 10px; line-height: 1.1;
    }
    .panel .note { color: var(--mute); font-size: .88rem; line-height: 1.5; margin: 0 0 22px; }
    .close-x {
      float: right; background: none; border: 0; color: var(--mute);
      font-size: 22px; cursor: pointer; line-height: 1;
    }
    ol.films { list-style: none; margin: 0; padding: 0; }
    ol.films li {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: baseline;
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }
    ol.films li:first-child { border-top: 0; }
    .num {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--gold); font-size: 1.15rem;
    }
    .ftitle { font-size: .95rem; line-height: 1.3; }
    .yrs {
      color: var(--mute); font-size: 11px; letter-spacing: .04em;
      white-space: nowrap; text-align: right;
    }
    .yrs b { color: var(--ink); font-weight: 500; }
    .empty { text-align: center; color: var(--mute); padding: 40px 0; }
    footer {
      margin-top: 56px; text-align: center; color: var(--mute);
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    .hide { display: none !important; }
  </style>
</head>

    <header class="hero">
      <p class="kicker">Guía de visión</p>
      <h1>Sagas <em>de cine</em></h1>
      <p class="lede">El orden de la historia, no el del estreno. Tocá una saga y aparece la lista. A la derecha: año de la trama y año de estreno.</p>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
        <input id="q" type="search" placeholder="Harry Potter, Marvel, Tokio…" autocomplete="off">
      </div>
      <div class="meta-bar"><span id="nsagas"></span><span>Solo películas</span></div>
    </header>
    <div class="layout" id="layout">
      <div class="grid" id="grid"></div>
      <aside class="panel" id="panel" hidden></aside>
    </div>
    <p class="empty hide" id="empty">Nada con esa búsqueda.</p>
    <footer>MCU sin series · Tokyo Drift después de Fast 6 · Animales fantásticos antes de Hogwarts</footer>

const grid = document.getElementById("grid");
const panel = document.getElementById("panel");
const layout = document.getElementById("layout");
const empty = document.getElementById("empty");
document.getElementById("nsagas").textContent = S.length + " sagas";

function years(s) {
  const ys = s.f.map(x => parseInt(x[2], 10)).filter(n => n > 1800);
  if (!ys.length) return "";
  return Math.min(...ys) + " – " + Math.max(...ys);
}

function renderCards(q) {
  const needle = (q || "").trim().toLowerCase();
  grid.innerHTML = "";
  let n = 0;
  S.forEach(s => {
    const hay = (s.n + " " + s.note + " " + s.f.map(x => x[0]).join(" ")).toLowerCase();
    if (needle && !hay.includes(needle)) return;
    n++;
    const b = document.createElement("button");
    b.className = "card" + (openId === s.id ? " on" : "");
    b.dataset.id = s.id;
    b.innerHTML = `<div class="count">${s.f.length} películas · ${years(s)}</div><h2>${s.n}</h2><p>${s.note}</p>`;
    b.addEventListener("click", () => openSaga(s.id));
    grid.appendChild(b);
  });
  empty.classList.toggle("hide", n !== 0);
  if (openId && !S.find(s => s.id === openId && (!needle || (s.n + s.note + s.f.map(x=>x[0]).join(" ")).toLowerCase().includes(needle)))) {
    closePanel();
  }
}

let openId = null;
function openSaga(id) {
  const s = S.find(x => x.id === id);
  if (!s) return;
  openId = id;
  layout.classList.add("has-open");
  panel.hidden = false;
  panel.innerHTML = `
    <button class="close-x" type="button" aria-label="Cerrar">×</button>
    <p class="panel-kicker">${s.f.length} películas</p>
    <h3>${s.n}</h3>
    <p class="note">${s.note}</p>
    <ol class="films">${s.f.map((x,i) => `<li>
      <span class="num">${String(i+1).padStart(2,"0")}</span>
      <span class="ftitle">${x[0]}</span>
      <span class="yrs"><b>${x[1]}</b><br>${x[2]}</span>
    </li>`).join("")}</ol>`;
  panel.querySelector(".close-x").onclick = closePanel;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("on", c.dataset.id === id));
  if (window.matchMedia("(max-width: 979px)").matches) {
    panel.scrollIntoView({ behavior: "smooth", block: "end" });
  }
}
function closePanel() {
  openId = null;
  layout.classList.remove("has-open");
  panel.hidden = true;
  panel.innerHTML = "";
  document.querySelectorAll(".card").forEach(c => c.classList.remove("on"));
}
document.getElementById("q").addEventListener("input", e => renderCards(e.target.value));
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
renderCards("");
  </script>
